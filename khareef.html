<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Beauty of Khareef</title>

    <link rel="stylesheet" href="./vendor/daisyui.css">
    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/settings.css">

    <!-- Tailwind CSS -->
    <script src="./vendor/tailwindcss.browser.js"></script>

    <!-- Vue.js 3 -->
    <script src="./vendor/vue.global.prod.js"></script>
    <script src="./vendor/lucide.min.js"></script>
</head>
<body>
<div id="app">
    <!-- Sidebar Drawer -->
    <sidebar></sidebar>

    <!-- Navigation Bar -->
    <navbar :on-settings-click="openSettings"></navbar>

    <!-- Settings Modal -->
    <settings-modal
            :is-open="isSettingsOpen"
            :current-locale="locale"
            :current-accent="accent"
            @close="closeSettings"
            @update:locale="setLocale"
            @update:accent="setAccent"
    ></settings-modal>

    <main class="pt-20">
        <h1 class="text-4xl font-bold text-center mb-8">{{ pageTitle }}</h1>

        <!-- Places Gallery -->
        <places-gallery
            category="khareef"
            @card-click="handleCardClick"
        ></places-gallery>

        <!-- Place Details Modal -->
        <place-details
            :place="selectedPlace"
            :is-open="!!selectedPlace"
            @close="selectedPlace = null"
        ></place-details>
    </main>

    <site-footer></site-footer>
</div>

<!-- i18n -->
<script src="./js/i18n/index.js"></script>

<!-- Shared Services -->
<script src="./js/services/themeService.js"></script>
<script src="./js/shared/preferences.js"></script>

<!-- Places Data -->
<script src="./js/data/placesData.js"></script>

<!-- Components -->
<script src="js/vue/components/layout/Sidebar.js"></script>
<script src="js/vue/components/layout/Navbar.js"></script>
<script src="./js/vue/components/Settings/SettingsHeader.js"></script>
<script src="./js/vue/components/Settings/SettingsLanguage.js"></script>
<script src="./js/vue/components/Settings/SettingsTheme.js"></script>
<script src="./js/vue/components/Settings/Settings.js"></script>
<script src="./js/vue/components/PlaceCard/PlaceCardImage.js"></script>
<script src="./js/vue/components/PlaceCard/PlaceCardBody.js"></script>
<script src="./js/vue/components/PlaceCard/PlaceCard.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsHeader.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsAbout.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsGallery.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsMap.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsActions.js"></script>
<script src="./js/vue/components/PlaceDetails/PlaceDetailsModal.js"></script>
<script src="./js/vue/components/Gallery.js"></script>
<script src="js/vue/components/layout/Footer.js"></script>

<!-- Vue App -->
<script>
    const {createApp, computed} = Vue;

    const app = createApp({
        mixins: [PreferencesMixin],
        data() {
            return {
                selectedPlace: null
            };
        },
        computed: {
            pageTitle() {
                return this.t('pages.khareef.title');
            }
        },
        mounted() {
            this.loadPreferences();
        },
        methods: {
            handleCardClick(place) {
                this.selectedPlace = place;
            },
            // i18n translation method
            t(key, fallback) {
                return window.t ? window.t(key, fallback) : fallback || key;
            }
        }
    });

    // Register components
    app.component('navbar', Navbar);
    app.component('sidebar', Sidebar);
    app.component('settings-modal', Settings);
    app.component('settings-header', SettingsHeader);
    app.component('settings-language', SettingsLanguage);
    app.component('settings-theme', SettingsTheme);
    app.component('place-card', PlaceCard);
    app.component('place-card-image', PlaceCardImage);
    app.component('place-card-body', PlaceCardBody);
    app.component('place-details', PlaceDetailsModal);
    app.component('place-details-header', PlaceDetailsHeader);
    app.component('place-details-about', PlaceDetailsAbout);
    app.component('place-details-gallery', PlaceDetailsGallery);
    app.component('place-details-map', PlaceDetailsMap);
    app.component('place-details-actions', PlaceDetailsActions);
    app.component('places-gallery', PlacesGallery);
    app.component('site-footer', Footer);

    // Mount app
    app.mount('#app');
</script>
</body>
</html>
