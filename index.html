<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-accent="jade">
    <head>
        <!-- Headers -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <base href="/dhofar/">
        <title>The Beauty of Dhofar</title>

        <!-- Styles -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" />
        <link rel="stylesheet" href="./css/general.css">
        <link rel="stylesheet" href="./css/index/carousel.css">
        <link rel="stylesheet" href="./css/settings.css">

        <!-- Tailwind CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <!-- Vue.js 3 CDN -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/typeit@8.7.1/dist/index.umd.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    <body>
        <div id="app">
            <!-- Sidebar Drawer -->
            <sidebar></sidebar>

            <!-- Navigation Bar -->
            <navbar :on-settings-click="openSettings"></navbar>

            <!-- Header -->
            <header>
                <!-- Carousel -->
                <carousel :language="language"></carousel>
            </header>

            <main>
                <view-section></view-section>
            </main>

            <!-- Settings Modal -->
            <settings-modal
                :is-open="isSettingsOpen"
                :current-language="language"
                :current-accent="accent"
                @close="closeSettings"
                @update:language="setLanguage"
                @update:accent="setAccent"
            ></settings-modal>

            <site-footer></site-footer>
        </div>

        <!-- i18n -->
        <script src="./js/i18n/index.js"></script>

        <!-- Shared Services -->
        <script src="./js/services/themeService.js"></script>
        <script src="./js/shared/preferences.js"></script>

        <!-- Components -->
        <script src="./js/vue/components/Sections/PlaceCategorySection.js"></script>
        <script src="./js/vue/components/Sections/ExploreHeader.js"></script>
        <script src="./js/vue/components/Sections/ExploreCardLarge.js"></script>
        <script src="./js/vue/components/Sections/ExploreCardSmall.js"></script>
        <script src="./js/vue/components/Sections/ExploreLeftColumn.js"></script>
        <script src="./js/vue/components/Sections/ExploreRightColumn.js"></script>
        <script src="./js/vue/components/Sidebar.js"></script>
        <script src="./js/vue/components/Navbar.js"></script>
        <script src="./js/vue/components/Carousel.js"></script>
        <script src="./js/vue/components/Section.js"></script>
        <script src="./js/vue/components/Settings.js"></script>
        <script src="./js/vue/components/Footer.js"></script>

        <!-- Vue App -->
        <script>
            const { createApp, computed } = Vue;

            const app = createApp({
                mixins: [PreferencesMixin],
                data() {
                    return {
                        selectedPlace: null,
                    };
                },
                mounted() {
                    this.loadPreferences();
                },
            });

            // Register components
            app.component('navbar', Navbar);
            app.component('sidebar', Sidebar);
            app.component('carousel', Carousel);
            app.component('view-section', ViewSection);
            app.component('settings-modal', Settings);
            app.component('site-footer', Footer);
            app.component('place-category-section', PlaceCategorySection);
            app.component('explore-header', ExploreHeader);
            app.component('explore-card-large', ExploreCardLarge);
            app.component('explore-card-small', ExploreCardSmall);
            app.component('explore-left-column', ExploreLeftColumn);
            app.component('explore-right-column', ExploreRightColumn);

            // Mount app
            app.mount('#app');
        </script>
    </body>
</html>
