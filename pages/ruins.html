<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/dhofar/">
    <title>Historical Ruins of Dhofar</title>

    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/settings.css">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Vue.js 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="app">
    <!-- Sidebar Drawer -->
    <sidebar></sidebar>

    <!-- Navigation Bar -->
    <navbar :on-settings-click="openSettings"></navbar>

    <!-- Settings Modal -->
    <settings-modal
            :is-open="isSettingsOpen"
            :current-language="language"
            :current-accent="accent"
            @close="closeSettings"
            @update:language="setLanguage"
            @update:accent="setAccent"
    ></settings-modal>

    <main class="pt-20">
        <h1 class="text-4xl font-bold text-center mb-8">{{ pageTitle }}</h1>

        <!-- Places Gallery -->
        <places-gallery
            category="ruins"
            @card-click="handleCardClick"
        ></places-gallery>

        <!-- Place Details Modal -->
        <place-details
            :place="selectedPlace"
            :is-open="!!selectedPlace"
            @close="selectedPlace = null"
        ></place-details>
    </main>
</div>

<!-- i18n -->
<script src="./js/i18n/index.js"></script>

<!-- Shared Services -->
<script src="./js/services/themeService.js"></script>
<script src="./js/shared/preferences.js"></script>

<!-- Places Data -->
<script src="./js/data/placesData.js"></script>

<!-- Components -->
<script src="./js/vue/components/Sidebar.js"></script>
<script src="./js/vue/components/Navbar.js"></script>
<script src="./js/vue/components/Settings.js"></script>
<script src="./js/vue/components/Gallery.js"></script>
<script src="./js/vue/components/Card.js"></script>
<script src="./js/vue/components/ContentOverview.js"></script>
<script src="./js/vue/components/Sections/ExploreHeader.js"></script>
<script src="./js/vue/components/Sections/ExploreCardLarge.js"></script>
<script src="./js/vue/components/Sections/ExploreCardSmall.js"></script>
<script src="./js/vue/components/Sections/ExploreLeftColumn.js"></script>
<script src="./js/vue/components/Sections/ExploreRightColumn.js"></script>

<!-- Vue App -->
<script>
    const {createApp, computed} = Vue;

    const app = createApp({
        mixins: [PreferencesMixin],
        data() {
            return {
                selectedPlace: null
            };
        },
        computed: {
            pageTitle() {
                return this.language === 'ar' ? 'الآثار التاريخية في ظفار' : 'Historical Ruins of Dhofar';
            }
        },
        mounted() {
            this.loadPreferences();
        },
        methods: {
            handleCardClick(place) {
                this.selectedPlace = place;
            }
        }
    });

    // Register components
    app.component('navbar', Navbar);
    app.component('sidebar', Sidebar);
    app.component('settings-modal', Settings);
    app.component('places-gallery', PlacesGallery);
    app.component('place-card', PlaceCard);
    app.component('place-details', PlaceDetails);
    app.component('explore-header', ExploreHeader);
    app.component('explore-card-large', ExploreCardLarge);
    app.component('explore-card-small', ExploreCardSmall);
    app.component('explore-left-column', ExploreLeftColumn);
    app.component('explore-right-column', ExploreRightColumn);

    // Mount app
    app.mount('#app');
</script>
</body>
</html>
