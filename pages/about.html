<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/dhofar/">
    <title>About</title>

    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/settings.css">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Vue.js 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="app">
    <!-- Sidebar Drawer -->
    <sidebar :is-index-page="false"></sidebar>

    <!-- Navigation Bar -->
    <navbar :on-settings-click="openSettings"></navbar>

    <!-- Settings Modal -->
    <settings-modal
            :is-open="isSettingsOpen"
            :current-language="language"
            :current-accent="accent"
            @close="closeSettings"
            @update:language="setLanguage"
            @update:accent="setAccent"
    ></settings-modal>

    <main class="pt-20">
        <about-hero></about-hero>
        <about-technologies></about-technologies>
    </main>
</div>

<!-- i18n -->
<script src="../js/i18n/index.js"></script>

<!-- Shared Services -->
<script src="../js/services/themeService.js"></script>
<script src="../js/shared/preferences.js"></script>

<!-- Components -->
<script src="./js/vue/components/Sidebar.js"></script>
<script src="./js/vue/components/Navbar.js"></script>
<script src="./js/vue/components/Settings.js"></script>
<script src="./js/vue/components/AboutHero.js"></script>
<script src="./js/vue/components/AboutTechnologies.js"></script>

<!-- Vue App -->
<script>
    const {createApp, computed} = Vue;

    const app = createApp({
        mixins: [PreferencesMixin],
        mounted() {
            this.loadPreferences();
        },
    });

    // Register components
    app.component('navbar', Navbar);
    app.component('sidebar', Sidebar);
    app.component('settings-modal', Settings);
    app.component('about-hero', AboutHero);
    app.component('about-technologies', AboutTechnologies);

    // Mount app
    app.mount('#app');
</script>
</body>
</html>
