<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/dhofar/">
    <title>The Beauty of Khareef</title>

    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/settings.css">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Vue.js 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="app">
    <!-- Sidebar Drawer -->
    <sidebar></sidebar>

    <!-- Navigation Bar -->
    <navbar :on-settings-click="openSettings"></navbar>

    <!-- Settings Modal -->
    <settings-modal
            :is-open="isSettingsOpen"
            :current-language="language"
            :current-accent="accent"
            @close="closeSettings"
            @update:language="setLanguage"
            @update:accent="setAccent"
    ></settings-modal>

    <main class="pt-20">
        <h1 class="text-4xl font-bold text-center mb-8">{{ pageTitle }}</h1>

        <!-- Places Gallery -->
        <places-gallery
            category="khareef"
            @card-click="handleCardClick"
        ></places-gallery>

        <!-- Place Details Modal -->
        <place-details
            :place="selectedPlace"
            :is-open="!!selectedPlace"
            @close="selectedPlace = null"
        ></place-details>
    </main>
</div>

<!-- i18n -->
<script src="./js/i18n/index.js"></script>

<!-- Components -->
<script src="./js/vue/components/Sidebar.js"></script>
<script src="./js/vue/components/Navbar.js"></script>
<script src="./js/vue/components/Settings.js"></script>
<script src="./js/vue/components/Gallery.js"></script>
<script src="./js/vue/components/Card.js"></script>
<script src="./js/vue/components/ContentOverview.js"></script>

<!-- Vue App -->
<script>
    const {createApp, computed} = Vue;

    const app = createApp({
        data() {
            return {
                language: 'en',
                accent: 'dark',
                isSettingsOpen: false,
                selectedPlace: null
            };
        },
        provide() {
            return {
                language: computed(() => this.language)
            };
        },
        computed: {
            pageTitle() {
                return this.language === 'ar' ? 'جمال الخريف' : 'The Beauty of Khareef';
            }
        },
        mounted() {
            this.loadPreferences();
        },
        methods: {
            loadPreferences() {
                const savedLanguage = localStorage.getItem('language');
                const savedAccent = localStorage.getItem('accent');

                if (savedLanguage) this.language = savedLanguage;
                if (savedAccent) this.accent = savedAccent;

                this.applyPreferences();
            },
            applyPreferences() {
                document.documentElement.setAttribute('data-theme', this.accent);
                if (this.language === 'ar') {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.title = 'جمال ظفار';
                } else {
                    document.documentElement.setAttribute('dir', 'ltr');
                    document.title = 'The Beauty of Khareef';
                }
            },
            openSettings() {
                this.isSettingsOpen = true;
            },
            closeSettings() {
                this.isSettingsOpen = false;
            },
            setLanguage(lang) {
                this.language = lang;
                localStorage.setItem('language', lang);
                window.i18n.setLocale(lang);
                this.applyPreferences();
            },
            setAccent(accent) {
                this.accent = accent;
                localStorage.setItem('accent', accent);
                this.applyPreferences();
            },
            handleCardClick(place) {
                this.selectedPlace = place;
            }
        }
    });

    // Register components
    app.component('navbar', Navbar);
    app.component('sidebar', Sidebar);
    app.component('settings-modal', Settings);
    app.component('places-gallery', PlacesGallery);
    app.component('place-card', PlaceCard);
    app.component('place-details', PlaceDetails);

    // Mount app
    app.mount('#app');
</script>
</body>
</html>
